[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "windsignal"
version = "1.0.0"
description = "WindSignal - UK Day-Ahead Wind Forecast Intelligence API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "WindSignal Analytics Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.vercel]
entrypoint = "src.api:app"
